# Builds the Android APK (and optionally an AAB) with GameCI. Needs a Unity license in the repository secrets:
#   UNITY_LICENSE (contents of the .ulf file, Personal licenses work), UNITY_EMAIL, UNITY_PASSWORD.
# Optional release signing: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEY_ALIAS, ANDROID_KEY_PASS.
# See Docs/BUILD.md. Run it from the Actions tab ("Run workflow") or push a tag like v1.0.0.
name: Build Android

on:
  workflow_dispatch:
    inputs:
      format:
        description: "apk (install on a phone) or aab (Google Play)"
        required: true
        default: apk
        type: choice
        options: [apk, aab]
  push:
    tags: ["v*"]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space (Unity Android images are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Read Unity version
        id: unity
        run: echo "version=$(grep 'm_EditorVersion:' ProjectSettings/ProjectVersion.txt | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      - name: Decode keystore (optional)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"; echo "CPW_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"; fi

      - name: Choose build method
        id: method
        run: |
          if [ "${{ github.event.inputs.format }}" = "aab" ]; then echo "name=BuildScript.BuildAndroidAab" >> "$GITHUB_OUTPUT"; else echo "name=BuildScript.BuildAndroidApk" >> "$GITHUB_OUTPUT"; fi

      - name: Firebase config (optional secret FIREBASE_CONFIG_JSON, see Docs/FIREBASE.md)
        env:
          CFG: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: if [ -n "$CFG" ]; then echo "$CFG" > Assets/CPW/Resources/firebase_config.json; fi

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          CPW_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          CPW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CPW_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        with:
          unityVersion: ${{ steps.unity.outputs.version }}
          targetPlatform: Android
          buildMethod: ${{ steps.method.outputs.name }}
          buildName: CrazyPenguinWars
          # GameCI passes -customBuildPath build/Android/CrazyPenguinWars.apk; BuildScript uses it (and .aab for bundles).

      - uses: actions/upload-artifact@v4
        with:
          name: CrazyPenguinWars-Android
          path: |
            build/Android/*.apk
            build/Android/*.aab
            Builds/Android/*.apk
            Builds/Android/*.aab
          if-no-files-found: error
